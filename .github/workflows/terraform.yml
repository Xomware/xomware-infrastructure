# Terraform CI/CD — console-triggerable via workflow_dispatch
name: Terraform

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['terraform/**', 'lambda/**']
  pull_request:
    branches: [master]
    paths: ['terraform/**', 'lambda/**']

concurrency:
  group: terraform-xomware-infrastructure
  cancel-in-progress: false

permissions:
  id-token: write # mint the OIDC token traded for the plan/apply role
  contents: read
  pull-requests: write

env:
  TF_DIR: terraform
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.5.7"

      # Read-only for plans, admin only for an apply on master. Selecting the
      # role by event means a pull request cannot assume the role that
      # mutates, regardless of what the workflow later does.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && secrets.AWS_TERRAFORM_APPLY_ROLE_ARN || secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -lock=false 2>&1 | tee /tmp/tf-plan.txt
        continue-on-error: true
        env:
          TF_VAR_command_center_passphrase_hash: ${{ secrets.COMMAND_CENTER_PASSPHRASE_HASH }}

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('/tmp/tf-plan.txt')
              ? fs.readFileSync('/tmp/tf-plan.txt', 'utf8')
              : '';
            const truncated = raw.length > 60000
              ? raw.substring(0, 60000) + '\n\n... (truncated)'
              : raw;
            const body = '### Terraform Plan 📋\n```\n' + truncated + '\n```\n*Plan: ' + process.env.PLAN_OUTCOME + '*';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_command_center_passphrase_hash: ${{ secrets.COMMAND_CENTER_PASSPHRASE_HASH }}
